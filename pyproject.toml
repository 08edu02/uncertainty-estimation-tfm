[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uncertainty-estimation-tfm"
version = "0.1.0"
description = "Comparison of uncertainty estimation methods for classification on tabular and medical image data (Master's thesis)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Carlos Eduardo Chavarria Mujica" }]
keywords = ["uncertainty-estimation", "calibration", "conformal-prediction", "deep-ensembles", "mc-dropout"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
  "matplotlib>=3.11",
  "medmnist>=3.0",
  "numpy>=2.5",
  "pandas>=3.1",
  "python-calamine>=0.4",
  "pyyaml>=6.0",
  "scikit-learn>=1.9",
  "scipy>=1.18",
  "seaborn>=0.13",
  "torch>=2.15",
  "torchvision>=0.29",
  "tqdm>=4.67",
]

[dependency-groups]
dev = [
  "ipykernel>=7.4",
  "pre-commit>=4.7",
  "pytest>=9.2",
  "pytest-cov>=7.0",
  "ruff>=0.17",
]

# --- PyTorch installation -------------------------------------------------
# On Linux and Windows, `torch` published on PyPI is not the CUDA build we
# want (on Windows it is a CPU-only wheel of ~127 MB). We therefore pull
# `torch` from the official PyTorch index for CUDA 13.2, which is the newest
# channel that ships wheels for this Python version on both platforms.
# macOS is left out of the marker so it keeps the default (MPS) wheel.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/uq"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["uq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["src/uq"]
